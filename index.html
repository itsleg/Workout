const SCHEDULES = {

  fiveDay: ["rest", "pushCore", "lower", "recovery", "pull", "full", "coreCond"],

};

// Weekly variety: each calisthenics day keeps its primary movements and rotates
// two or three accessory slots from a pool, so the same weekday isn't identical
// week to week while still training the day's target areas.
const DAY_POOL = {
  pushCore: {
    base: ["push", "tri", "pike"],
    pool: ["plank", "deadbug", "core", "oblique", "pushvar"]
  },
  lower: {
    base: ["squat", "lunge", "glute"],
    pool: ["calf", "stepup", "deadbug", "oblique", "hamcurl"]
  },
  pull: {
    base: ["back", "hinge"],
    pool: ["birddog", "core", "cardio", "oblique", "hamcurl"]
  },
  full: {
    base: ["push", "squat", "back"],
    pool: ["full", "plank", "oblique", "cardio", "pushvar"]
  }
};
function buildSlots(focus, weekNum, short) {
  const dp = DAY_POOL[focus];
  if (!dp) return (DAYS[focus] || DAYS.pushCore).slots;
  const need = (short ? 4 : 5) - dp.base.length;
  const picks = [];
  for (let k = 0; k < need; k++) picks.push(dp.pool[(weekNum + k) % dp.pool.length]);
  return [...dp.base, ...picks];
}

// Returns the exercise to show for a slot given level + active injury regions.
// Movement pattern per slot — used to avoid repeating the same pattern across the
// qi gong -> calisthenics seam when the session is done continuously.
const SLOT_PAT = {
  push: "push",
  tri: "push",
  pike: "vpush",
  squat: "squat",
  lunge: "squat",
  glute: "hinge",
  calf: "calf",
  back: "pull",
  hinge: "hinge",
  birddog: "core",
  plank: "core",
  deadbug: "core",
  core: "core",
  cardio: "cardio",
  full: "full",
  oblique: "core",
  stepup: "squat",
  pushvar: "push",
  hamcurl: "hinge"
};
// Qi gong meaningfully primes two calisthenics patterns: pushups (push) and its
// bodyweight/ballet squats (squat). The calisthenics opener avoids these when chained.
const QIGONG_PRIMES = ["push", "squat"];
function selectExercise(slot, level, regions, equipment = "bodyweight") {
  const subs = INJ[slot];
  // Injury protection takes priority over equipment.
  if (subs && regions.length) {
    const stress = [...new Set(subs.flatMap(s => s.clears))];
    const C = regions.filter(r => stress.includes(r));
    if (C.length) {
      const fit = subs.filter(s => C.every(r => s.clears.includes(r))).sort((a, b) => a.clears.length - b.clears.length);
      const chosen = fit[0] ? fit[0].ex : {
        name: "Dead Bug",
        reps: "3 × 10 / side",
        cue: "A gentle, joint-friendly alternative while you protect the affected areas."
      };
      return {
        ...chosen,
        target: S[slot].target,
        modified: true,
        regions: C
      };
    }
  }
  // Equipment variant, if one exists for this slot.
  if (equipment !== "bodyweight" && EQUIP[slot] && EQUIP[slot][equipment] && EQUIP[slot][equipment][level]) {
    return {
      ...EQUIP[slot][equipment][level],
      target: S[slot].target,
      equip: equipment
    };
  }
  return {
    ...S[slot][level],
    target: S[slot].target
  };
}

function dailyFlow(target, dayNum, count) {
  count = count || 16;
  target = target || [];
  const pool = FLOW_POOL.filter(p => !p.closer);
  const closer = FLOW_POOL.find(p => p.closer);
  const scored = pool.map((p, i) => ({
    p,
    score: p.areas.filter(a => target.includes(a)).length * 100 + (i + (dayNum || 0)) % pool.length
  }));
  scored.sort((a, b) => b.score - a.score);
  const picked = [],
    cc = {};
  for (const s of scored) {
    const b = s.p.chain;
    if ((cc[b] || 0) >= 3) continue;
    picked.push(s.p);
    cc[b] = (cc[b] || 0) + 1;
    if (picked.length >= count - 1) break;
  }
  picked.sort((a, b) => a.chain - b.chain);
  return closer ? [...picked, closer] : picked;
}

// Movement-group key: only clear cross-program duplicates share a key; everything else
// stays unique (never deduped). Priority order handles which program keeps the move.
function mgKey(name) {
  const n = (name || "").toLowerCase();
  if (n.includes("cat")) return "catcow";
  if (n.includes("neck")) return "neckroll";
  if (n.includes("chest open")) return "chestopener";
  if (n.includes("figure-4") || n.includes("figure 4")) return "figure4";
  if (n.includes("downward") || n.includes("down dog")) return "downdog";
  if (n.includes("child")) return "childs";
  if (n.includes("thread the needle")) return "thread";
  return "u:" + n;
}

// Qi gong is built entirely from the tagged pool — no fixed core. It selects `count`
// moves tailored to yesterday's input (worked / tight / sore / mobility), spread across
// zones, with breath/settle as optional open/close if they get picked.
function dailyQiGong(target, dayNum, count, avoid) {
  count = count || 15;
  avoid = avoid || [];
  const pool = QI_POOL.filter(p => !(p.pat && avoid.includes(p.pat)));
  const scored = pool.map((p, i) => ({
    p,
    score: p.areas.filter(a => target.includes(a)).length * 100 + (p.intensity || 1) * 5 + (i + (dayNum || 0)) % pool.length
  }));
  scored.sort((a, b) => b.score - a.score);
  const picked = [],
    zc = {};
  const cap = Math.max(2, Math.ceil(count / 5) + 1);
  for (const s of scored) {
    const z = s.p.zone;
    if ((zc[z] || 0) >= cap) continue;
    picked.push(s.p);
    zc[z] = (zc[z] || 0) + 1;
    if (picked.length >= count) break;
  }
  if (picked.length < count) for (const s of scored) {
    if (!picked.includes(s.p)) {
      picked.push(s.p);
      if (picked.length >= count) break;
    }
  }
  // Guarantee the practice builds: ensure at least a couple of sweat-building moves are in.
  const dyn = pool.filter(p => (p.intensity || 1) >= 3 && !picked.includes(p));
  let di = 0;
  while (picked.filter(p => (p.intensity || 1) >= 3).length < 2 && di < dyn.length) {
    const idx = picked.findIndex(p => (p.intensity || 1) === 1 && !p.bookend);
    if (idx === -1) break;
    picked.splice(idx, 1, dyn[di++]);
  }
  // Order the arc: loosen up first (low intensity), build a sweat toward the end (high),
  // with breath opening and settle closing if they were picked.
  const open = picked.find(p => p.bookend === "open");
  const close = picked.find(p => p.bookend === "close");
  let seq = picked.filter(p => !p.bookend);
  seq.sort((a, b) => (a.intensity || 1) - (b.intensity || 1));
  if (open) seq = [open, ...seq];
  if (close) seq = [...seq, close];
  return seq;
}
